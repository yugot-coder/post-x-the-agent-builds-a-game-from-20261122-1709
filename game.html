<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON DRIFT: BALI — a one-file canvas game</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a0b2e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: min(100vw, 177.78vh); }
  canvas { display: block; width: 100%; background: #2a1a5e;
           box-shadow: 0 0 60px rgba(255,158,94,.25), 0 0 140px rgba(232,93,117,.12); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
"use strict";
// ============================================================
//  NEON DRIFT: BALI — one file, no libraries.
//  Sunset over the Island of the Gods. Dodge the volcanic
//  rocks. Collect the frangipani sparks. The drift only gets
//  faster. Steer with the arrow keys / WASD, the mouse, or a
//  finger. SPACE starts, R restarts.
// ============================================================
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const SEA_Y = Math.round(H * 0.78);          // horizon line

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

// ---------- sky sparkles (3 parallax layers) ----------
const layers = [];
for (let l = 0; l < 3; l++) {
  const stars = [];
  const n = [70, 46, 26][l];
  for (let i = 0; i < n; i++)
    stars.push({ x: Math.random() * W, y: Math.random() * SEA_Y,
                 r: [1, 1.6, 2.4][l], tw: rand(0, TAU) });
  layers.push({ stars, speed: [16, 34, 62][l],
                color: ["#a86a9e", "#e89bb4", "#ffe3c2"][l] });
}

// ---------- the ship ----------
const ship = { x: W / 2, y: H - 90, vx: 0, vy: 0, r: 13, tilt: 0, alive: true };
const keys = {};
let pointer = null;
let paused = false;
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === " " || e.key.startsWith("Arrow")) e.preventDefault();
  if (state === "play" && (e.key === "p" || e.key === "P")) paused = !paused;
  if (state === "title" && (e.key === " " || e.key === "Enter")) startGame();
  if (state === "over" && (e.key === "r" || e.key === "R" || e.key === " ")) startGame();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
cv.addEventListener("pointermove", e => {
  const b = cv.getBoundingClientRect();
  pointer = { x: (e.clientX - b.left) * W / b.width,
              y: (e.clientY - b.top) * H / b.height };
});
cv.addEventListener("pointerdown", () => { if (state !== "play") startGame(); });

// ---------- rocks and frangipani sparks ----------
let rocks = [], gems = [], parts = [], floaters = [];
function spawnRock(speed) {
  const r = rand(16, 44), pts = [];
  const n = 9 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, d = r * rand(0.72, 1.08);
    pts.push({ x: Math.cos(a) * d, y: Math.sin(a) * d });
  }
  rocks.push({ x: rand(r, W - r), y: -r - 10, r, pts,
               vy: speed * rand(0.85, 1.25), vx: rand(-24, 24),
               rot: rand(0, TAU), vr: rand(-1.4, 1.4) });
}
function spawnGem(speed) {
  gems.push({ x: rand(30, W - 30), y: -24, r: 11,
              vy: speed * rand(0.55, 0.75), tw: rand(0, TAU) });
}
function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(30, power);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                 life: rand(0.35, 0.9), age: 0, color, r: rand(1.5, 3.5) });
  }
}

// ---------- game state ----------
let state = "title";           // title | play | over
let score = 0, best = 0, t = 0, speedMul = 1, rockTimer = 0, gemTimer = 1.2;
function startGame() {
  score = 0; t = 0; speedMul = 1; rocks = []; gems = []; parts = []; floaters = [];
  ship.x = W / 2; ship.y = H - 90; ship.vx = ship.vy = 0; ship.alive = true;
  rockTimer = 0.4; gemTimer = 0.8; state = "play";
}

// ---------- update ----------
function update(dt) {
  for (const L of layers) for (const s of L.stars) {
    s.y += (L.speed * (state === "play" ? speedMul : 0.35)) * dt;
    s.tw += dt * 3;
    if (s.y > SEA_Y - 2) { s.y = -3; s.x = Math.random() * W; }
  }
  if (state !== "play") { updateParts(dt); return; }

  t += dt;
  speedMul = 1 + t / 22;                       // the ramp: +1x every 22 s
  const fall = 235 * speedMul;

  // steering: keys accelerate, pointer attracts
  const ACC = 2600, MAXV = 430;
  if (keys["arrowleft"] || keys["a"]) ship.vx -= ACC * dt;
  if (keys["arrowright"] || keys["d"]) ship.vx += ACC * dt;
  if (keys["arrowup"] || keys["w"]) ship.vy -= ACC * dt;
  if (keys["arrowdown"] || keys["s"]) ship.vy += ACC * dt;
  if (pointer) {
    ship.vx += clamp((pointer.x - ship.x) * 14, -ACC, ACC) * dt;
    ship.vy += clamp((pointer.y - ship.y) * 14, -ACC, ACC) * dt;
  }
  ship.vx *= Math.pow(0.0015, dt); ship.vy *= Math.pow(0.0015, dt);
  ship.vx = clamp(ship.vx, -MAXV, MAXV); ship.vy = clamp(ship.vy, -MAXV, MAXV);
  ship.x = clamp(ship.x + ship.vx * dt, ship.r + 4, W - ship.r - 4);
  ship.y = clamp(ship.y + ship.vy * dt, ship.r + 40, H - ship.r - 6);
  ship.tilt = clamp(ship.vx / MAXV, -1, 1) * 0.42;

  // spawns get denser as the speed climbs
  rockTimer -= dt;
  if (rockTimer <= 0) { spawnRock(fall); rockTimer = rand(0.34, 0.8) / Math.sqrt(speedMul); }
  gemTimer -= dt;
  if (gemTimer <= 0) { spawnGem(fall); gemTimer = rand(1.1, 2.4); }

  // rocks
  for (const r of rocks) {
    r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt;
    const dx = r.x - ship.x, dy = r.y - ship.y;
    if (dx * dx + dy * dy < (r.r * 0.82 + ship.r) ** 2) {
      ship.alive = false; state = "over";
      best = Math.max(best, score);
      burst(ship.x, ship.y, "#00e5ff", 42, 320);
      burst(ship.x, ship.y, "#ff2bd6", 26, 240);
      burst(ship.x, ship.y, "#ffd94d", 18, 180);
    }
  }
  rocks = rocks.filter(r => r.y < H + 70);

  // frangipani sparks: collect for +10
  for (const g of gems) {
    g.y += g.vy * dt; g.tw += dt * 6;
    const dx = g.x - ship.x, dy = g.y - ship.y;
    if (dx * dx + dy * dy < (g.r + ship.r + 7) ** 2) {
      g.dead = true; score += 10;
      burst(g.x, g.y, "#ffd94d", 12, 150);
      floaters.push({ x: g.x, y: g.y - 14, txt: "+10", age: 0 });
    }
  }
  gems = gems.filter(g => !g.dead && g.y < H + 30);

  for (const f of floaters) { f.y -= 42 * dt; f.age += dt; }
  floaters = floaters.filter(f => f.age < 0.9);
  updateParts(dt);
}
function updateParts(dt) {
  for (const p of parts) {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98;
  }
  parts = parts.filter(p => p.age < p.life);
}

// ---------- Bali scenery (silhouettes on the horizon) ----------
const SIL = "#22103d";
function drawPalm(x, base, h, lean) {
  ctx.strokeStyle = SIL; ctx.fillStyle = SIL;
  ctx.lineWidth = 7; ctx.beginPath();
  ctx.moveTo(x, base);
  ctx.quadraticCurveTo(x + lean * 0.3, base - h * 0.6, x + lean, base - h);
  ctx.stroke();
  const tx = x + lean, ty = base - h;
  ctx.lineWidth = 4.5;
  for (const a of [-2.8, -2.2, -1.5, -0.8, -0.25]) {
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * 34, ty + Math.sin(a) * 26 - 8,
                         tx + Math.cos(a) * 58, ty + Math.sin(a) * 44 + 16);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(tx - 5, ty + 7, 5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(tx + 6, ty + 9, 4.2, 0, TAU); ctx.fill();
}
function drawMeru(x, base, w, tiers) {
  ctx.fillStyle = SIL;
  const th = 15;                                  // tier height
  for (let i = 0; i < tiers; i++) {
    const tw = w * (1 - i * 0.16), ty = base - i * th;
    ctx.beginPath();
    ctx.moveTo(x - tw / 2 - 7, ty); ctx.lineTo(x + tw / 2 + 7, ty);
    ctx.lineTo(x + tw / 2, ty - th + 4); ctx.lineTo(x - tw / 2, ty - th + 4);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(x - tw / 2 + 4, ty - th - 7, tw - 8, 8);
  }
  const topY = base - tiers * th;
  ctx.beginPath(); ctx.moveTo(x - 4, topY); ctx.lineTo(x + 4, topY);
  ctx.lineTo(x, topY - 12); ctx.closePath(); ctx.fill();
}
function drawGate(x, base, w, h) {
  // candi bentar: two mirrored stepped halves with a gap between
  ctx.fillStyle = SIL;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    const x0 = x + s * 5, x1 = x + s * (w / 2);
    ctx.moveTo(x0, base); ctx.lineTo(x1, base);
    const steps = 6;
    for (let i = 1; i <= steps; i++)
      ctx.lineTo(x + s * (w / 2 - (w / 2 - 6) * i / steps), base - h * i / steps);
    ctx.lineTo(x0, base - h); ctx.closePath(); ctx.fill();
  }
}
function drawScenery(now) {
  // sun: a big low disc sinking into the sea, gentle sine breathing
  const sunX = W * 0.5, sunY = SEA_Y - 58 + Math.sin(now * 0.0004) * 3, sunR = 74;
  const sg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, sunR * 2.1);
  sg.addColorStop(0, "rgba(255,214,140,.85)");
  sg.addColorStop(0.35, "rgba(255,158,94,.35)");
  sg.addColorStop(1, "rgba(255,158,94,0)");
  ctx.fillStyle = sg; ctx.fillRect(sunX - sunR * 2.2, sunY - sunR * 2.2, sunR * 4.4, sunR * 4.4);
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, TAU);
  const sd = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
  sd.addColorStop(0, "#ffd684"); sd.addColorStop(1, "#ff7e5f");
  ctx.fillStyle = sd; ctx.fill();
  // island silhouette band
  ctx.fillStyle = SIL;
  ctx.beginPath();
  ctx.moveTo(0, SEA_Y);
  ctx.lineTo(0, SEA_Y - 16); ctx.lineTo(120, SEA_Y - 22); ctx.lineTo(250, SEA_Y - 12);
  ctx.lineTo(390, SEA_Y - 20); ctx.lineTo(520, SEA_Y - 10); ctx.lineTo(660, SEA_Y - 18);
  ctx.lineTo(800, SEA_Y - 12); ctx.lineTo(960, SEA_Y - 20); ctx.lineTo(960, SEA_Y);
  ctx.closePath(); ctx.fill();
  drawGate(150, SEA_Y - 14, 92, 96);
  drawMeru(742, SEA_Y - 12, 74, 5);
  drawMeru(838, SEA_Y - 12, 52, 3);
  drawPalm(58, SEA_Y - 12, 86, -20);
  drawPalm(318, SEA_Y - 14, 68, 16);
  drawPalm(905, SEA_Y - 14, 92, 22);
  // sea: gradient + a moving sun-glint highlight (ambient layer)
  const sea = ctx.createLinearGradient(0, SEA_Y, 0, H);
  sea.addColorStop(0, "#3d1e63"); sea.addColorStop(0.25, "#2c1550"); sea.addColorStop(1, "#180a33");
  ctx.fillStyle = sea; ctx.fillRect(0, SEA_Y, W, H - SEA_Y);
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 26; i++) {
    const gy = SEA_Y + 8 + i * 4.4;
    const gw = 130 - i * 3.4, gx = sunX - gw / 2 + Math.sin(now * 0.0011 + i * 1.7) * 9;
    ctx.fillStyle = i % 2 ? "#ff9e5e" : "#ffc98a";
    ctx.fillRect(gx, gy, gw, 2.1);
  }
  ctx.restore();
}

// ---------- drawing ----------
function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y); ctx.rotate(ship.tilt);
  // engine flame
  const fl = 16 + Math.random() * 9;
  ctx.beginPath();
  ctx.moveTo(-6, 13); ctx.lineTo(0, 13 + fl); ctx.lineTo(6, 13); ctx.closePath();
  ctx.fillStyle = "rgba(255,150,40,.9)"; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3.4, 13); ctx.lineTo(0, 13 + fl * 0.55); ctx.lineTo(3.4, 13); ctx.closePath();
  ctx.fillStyle = "rgba(255,230,150,.95)"; ctx.fill();
  // hull
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(12, 12); ctx.lineTo(4, 7);
  ctx.lineTo(-4, 7); ctx.lineTo(-12, 12); ctx.closePath();
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#0e2a3d"; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 2.2; ctx.stroke();
  // cockpit
  ctx.beginPath(); ctx.arc(0, -4, 4.2, 0, TAU);
  ctx.fillStyle = "#bffcff"; ctx.fill();
  ctx.restore();
}
function drawRock(r) {
  // volcanic rock: dark basalt with a warm sunset rim
  ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
  ctx.beginPath();
  r.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = "#241722"; ctx.fill();
  ctx.strokeStyle = "#ff8c5a"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-r.r * 0.25, -r.r * 0.15, r.r * 0.18, 0, TAU);
  ctx.strokeStyle = "rgba(255,158,94,.5)"; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
}
function drawGem(g) {
  // frangipani spark: five golden petals turning around a bright heart
  const s = g.r * (1 + Math.sin(g.tw) * 0.14);
  ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.tw * 0.35);
  ctx.shadowColor = "#ffd94d"; ctx.shadowBlur = 16;
  for (let i = 0; i < 5; i++) {
    ctx.save(); ctx.rotate(i * TAU / 5);
    ctx.beginPath(); ctx.ellipse(0, -s * 0.52, s * 0.34, s * 0.58, 0, 0, TAU);
    ctx.fillStyle = "#ffd94d"; ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(0, 0, 3.1, 0, TAU); ctx.fillStyle = "#fff3cf"; ctx.fill();
  ctx.restore();
}
function text(str, x, y, size, color, align = "left", bold = true) {
  ctx.font = `${bold ? "700 " : ""}${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function draw(now) {
  // Bali sunset gradient
  const gr = ctx.createLinearGradient(0, 0, 0, SEA_Y);
  gr.addColorStop(0, "#2a1a5e"); gr.addColorStop(0.45, "#7e2a6e");
  gr.addColorStop(0.75, "#e85d75"); gr.addColorStop(1, "#ff9e5e");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, SEA_Y);
  // sky sparkles
  for (const L of layers) for (const s of L.stars) {
    ctx.globalAlpha = 0.5 + Math.sin(s.tw) * 0.3;
    ctx.fillStyle = L.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawScenery(now);

  for (const g of gems) drawGem(g);
  for (const r of rocks) drawRock(r);
  if (ship.alive) drawShip();
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.age / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.age / 0.9;
    text(f.txt, f.x, f.y, 20, "#ffd94d", "center");
  }
  ctx.globalAlpha = 1;

  // HUD
  text("SCORE " + String(score).padStart(4, "0"), 22, 38, 24, "#fff3e2");
  text("SPEED x" + speedMul.toFixed(1), W - 22, 38, 24,
       speedMul > 1.8 ? "#ff5d8f" : "#fff3e2", "right");
  text("BEST " + String(best).padStart(4, "0"), 22, 66, 15, "#e8b4c8");

  if (state === "title") {
    ctx.fillStyle = "rgba(24,8,40,.45)"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 34;
    text("NEON DRIFT", W / 2, 196, 84, "#00e5ff", "center");
    ctx.restore();
    ctx.save();
    ctx.shadowColor = "#ffb35c"; ctx.shadowBlur = 26;
    text("B A L I", W / 2, 252, 40, "#ffb35c", "center");
    ctx.restore();
    text("Sunset over the Island of the Gods", W / 2, 292, 22, "#ffe3c2", "center");
    text("Arrow keys / WASD / mouse / touch to steer", W / 2, 336, 20, "#ffe9f2", "center");
    text("Press SPACE or click to launch", W / 2, 374, 20, "#ffd94d", "center");
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(24,8,40,.5)"; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.shadowColor = "#ff2bd6"; ctx.shadowBlur = 30;
    text("DRIFT OVER", W / 2, 226, 64, "#ff2bd6", "center");
    ctx.restore();
    text("Score " + score + "   ·   Best " + best, W / 2, 282, 26, "#fff3e2", "center");
    text("Press R to fly again", W / 2, 330, 20, "#ffd94d", "center");
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  draw(now);
  if (paused && state === "play")
    text("PAUSED — P to resume", W / 2, H / 2, 34, "#ffd94d", "center");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
